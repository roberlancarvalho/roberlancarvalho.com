<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#38bdf8"/></marker></defs>
<rect width="900" height="460" rx="16" fill="#0f172a"/>
<text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700">O ciclo de um agente de IA</text>
<rect x="40" y="170" width="170" height="90" rx="14" fill="#111c33" stroke="#64748b" stroke-width="2"/><text x="125.0" y="208" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Objetivo</text><text x="125.0" y="234" fill="#94a3b8" font-size="14" text-anchor="middle">o que deve ser feito</text>
<rect x="300" y="90" width="200" height="90" rx="14" fill="#111c33" stroke="#38bdf8" stroke-width="2"/><text x="400.0" y="128" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Planeja</text><text x="400.0" y="154" fill="#94a3b8" font-size="14" text-anchor="middle">o modelo decide</text>
<rect x="620" y="170" width="220" height="90" rx="14" fill="#111c33" stroke="#a78bfa" stroke-width="2"/><text x="730.0" y="208" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Age</text><text x="730.0" y="234" fill="#94a3b8" font-size="14" text-anchor="middle">chama uma ferramenta</text>
<rect x="300" y="270" width="200" height="90" rx="14" fill="#111c33" stroke="#34d399" stroke-width="2"/><text x="400.0" y="308" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Observa</text><text x="400.0" y="334" fill="#94a3b8" font-size="14" text-anchor="middle">lê o resultado</text>
<line x1="210" y1="205" x2="296" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="135" x2="616" y2="195" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">API, banco, e-mail…</text>
<line x1="620" y1="240" x2="504" y2="300" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="400" y1="270" x2="400" y2="184" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a)"/><text x="470" y="232" fill="#94a3b8" font-size="13" text-anchor="middle">repete até concluir</text>
<rect x="590" y="330" width="250" height="70" rx="14" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="7 6"/>
<text x="715" y="360" fill="#f472b6" font-size="16" font-weight="700" text-anchor="middle">Humano no circuito</text>
<text x="715" y="383" fill="#94a3b8" font-size="13" text-anchor="middle">aprova ações sensíveis</text>
<line x1="730" y1="262" x2="730" y2="326" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 5"/>
<text x="40" y="430" fill="#64748b" font-size="13">Chatbot: responde e para. Agente: repete o ciclo, usando ferramentas, até cumprir o objetivo.</text>
</svg>